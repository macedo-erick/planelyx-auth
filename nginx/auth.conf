server {
    listen 80;
    listen [::]:80;
    server_name auth.macedosoftware.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://auth.macedosoftware.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.macedosoftware.com;

    ssl_certificate     /etc/letsencrypt/live/auth.macedosoftware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.macedosoftware.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        return 302 /auth/;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8085;
        include /etc/nginx/snippets/keycloak-proxy.conf;
    }
}
