# Planelyx login theme.
#
# Inherits everything from keycloak.v2 (the PatternFly v5 default) and layers a
# single stylesheet on top, so every screen Keycloak owns — login, register,
# forgot-password, OTP, identity-provider linking — is themed without copying
# templates that would then need maintaining across upgrades.
#
# template.ftl is the shared outer shell every page (login/register/reset-password/...)
# wraps itself in via `<@layout.registrationLayout>`; overriding it once gives every
# page the split-screen branding-panel layout and a set of `aside*` macro parameters
# (title/body/CTA copy for the right-hand panel) without duplicating each page's form
# markup. login.ftl is left inherited from keycloak.v2 since its defaults match; register.ftl
# and login-reset-password.ftl ARE copied here, but only to pass page-specific asideTitle/
# asideBody/asideCtaHref/asideCtaLabel into that same macro — their form markup is untouched.
# Keep the `<#nested ...>` calls and section names untouched when re-syncing with upstream.
#
# `styles` is a full override, so css/styles.css (resolved from the parent theme)
# has to be listed again before ours. `stylesCommon` is deliberately not declared:
# leaving it inherited keeps PatternFly loading.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/planelyx.css
