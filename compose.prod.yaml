name: auth

networks:
  auth:
    ipam:
      config:
        - subnet: 172.21.0.0/16

services:
  keycloak:
    image: ${REGISTRY:?REGISTRY is not set}/keycloak:${AUTH_TAG:?AUTH_TAG is not set}
    restart: unless-stopped
    ports: ['127.0.0.1:8085:8080']
    networks: [auth]
    extra_hosts:
      - 'host.docker.internal:host-gateway'
      - 'planelyx.com:host-gateway'
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://host.docker.internal:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_LOG_LEVEL: ${AUTH_LOG_LEVEL:-info}
      PLANELYX_UI_ORIGIN: https://planelyx.com
      PLANELYX_UI_BASE_URL: https://planelyx.com/ui
      PLANELYX_KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET is not set}
      PROVISIONING_PLANELYX_URL: https://planelyx.com/internal/keycloak/user-registered
      PROVISIONING_PLANELYX_SECRET: ${PLANELYX_PROVISIONING_SECRET:?PLANELYX_PROVISIONING_SECRET is not set}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'exec 3<>/dev/tcp/127.0.0.1/9000; echo -e "GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
