name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      auth_tag:
        description: 'Commit SHA of an image already in Artifact Registry — deploy it as-is, skipping the build. Blank builds this branch.'
        type: string
        default: ''
      allow_secret_change:
        description: 'Allow credentials to differ from the VPS (credential rotation)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-auth-production
  cancel-in-progress: false

env:
  REGION: southamerica-east1
  REPOSITORY: auth
  IMAGE: keycloak
  VPS_PATH: auth
  ADMIN_URL: https://auth.macedosoftware.com
  ISSUER_CHECKS: |
    https://planelyx.com planelyx
    https://auth.macedosoftware.com planelyx
  NEIGHBOUR_URL: https://monitoring.macedosoftware.com/login
  PAYLOAD: compose.prod.yaml
  NGINX_PAYLOAD: nginx/auth.conf nginx/catch-all.conf nginx/snippets/keycloak-proxy.conf
  WAIT_TIMEOUT: '300'

jobs:
  build:
    if: ${{ !inputs.auth_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - run: for f in realms/*.json; do jq empty "$f"; done

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: ${{ always() && needs.build.result != 'failure' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      AUTH_TAG: ${{ inputs.auth_tag || github.sha }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.auth_tag || github.sha }}

      - name: Validate inputs
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          KC_DB_PASSWORD: ${{ secrets.KC_DB_PASSWORD }}
          KC_ADMIN: ${{ secrets.KC_ADMIN }}
          KC_ADMIN_PASSWORD: ${{ secrets.KC_ADMIN_PASSWORD }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          PLANELYX_PROVISIONING_SECRET: ${{ secrets.PLANELYX_PROVISIONING_SECRET }}
          LISTRYX_KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.LISTRYX_KEYCLOAK_ADMIN_CLIENT_SECRET }}
          AUTH_LOG_LEVEL: ${{ vars.AUTH_LOG_LEVEL }}
        run: |
          set -euo pipefail
          fail=0

          if [[ ! $AUTH_TAG =~ ^[A-Za-z0-9._-]{1,128}$ ]]; then
              echo "::error::'$AUTH_TAG' is not a valid image tag. Allowed: letters, digits, dot, underscore, hyphen (max 128)."
              fail=1
          fi

          for name in GCP_PROJECT_ID KC_DB_PASSWORD KC_ADMIN KC_ADMIN_PASSWORD KEYCLOAK_ADMIN_CLIENT_SECRET PLANELYX_PROVISIONING_SECRET LISTRYX_KEYCLOAK_ADMIN_CLIENT_SECRET; do
              value=${!name}
              if [[ -z $value ]]; then
                  echo "::error::Repo secret $name is empty or not set. See VPS_SETUP.md §6."
                  fail=1
              elif [[ $value == *"'"* ]]; then
                  echo "::error::Repo secret $name contains a single quote, which cannot be represented in a Compose .env value. Regenerate it without one."
                  fail=1
              fi
          done

          if [[ -n ${AUTH_LOG_LEVEL:-} && ! ${AUTH_LOG_LEVEL^^} =~ ^(ALL|TRACE|DEBUG|INFO|WARN|ERROR|FATAL|OFF)$ ]]; then
              echo "::error::Repo variable AUTH_LOG_LEVEL is '$AUTH_LOG_LEVEL'. Expected one of all trace debug info warn error fatal off."
              fail=1
          fi

          (( fail == 0 )) || exit 1

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/deploy_known_hosts

          {
              echo "SSH_OPTS=-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/deploy_known_hosts -i $HOME/.ssh/deploy_key"
              echo "REMOTE=$VPS_USER@$VPS_HOST"
          } >> "$GITHUB_ENV"

      - name: Ship the config tree and the nginx config
        run: |
          set -euo pipefail
          ssh $SSH_OPTS "$REMOTE" "rm -rf '$VPS_PATH/.staged' && mkdir -p '$VPS_PATH/.staged'"
          tar -cz $PAYLOAD | ssh $SSH_OPTS "$REMOTE" "tar -xz -C '$VPS_PATH/.staged'"

          ssh $SSH_OPTS "$REMOTE" "rm -rf '$VPS_PATH/.nginx-staged' && mkdir -p '$VPS_PATH/.nginx-staged'"
          tar -cz $NGINX_PAYLOAD | ssh $SSH_OPTS "$REMOTE" "tar -xz -C '$VPS_PATH/.nginx-staged'"

          echo "Shipped the config tree and the nginx config from ${AUTH_TAG:0:7}"

      - name: Check for credential drift
        if: ${{ !inputs.allow_secret_change }}
        env:
          KC_DB_PASSWORD: ${{ secrets.KC_DB_PASSWORD }}
          KC_ADMIN: ${{ secrets.KC_ADMIN }}
          KC_ADMIN_PASSWORD: ${{ secrets.KC_ADMIN_PASSWORD }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          PLANELYX_PROVISIONING_SECRET: ${{ secrets.PLANELYX_PROVISIONING_SECRET }}
          LISTRYX_KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.LISTRYX_KEYCLOAK_ADMIN_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          env_exists=$(ssh $SSH_OPTS "$REMOTE" "test -f '$VPS_PATH/.env' && echo yes || echo no")

          if [[ $env_exists == no ]]; then
              echo "First deploy: no .env on the VPS yet, nothing to compare against."
              exit 0
          fi

          read_env_key() {
              ssh $SSH_OPTS "$REMOTE" "bash -s -- '$VPS_PATH' '$1'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$1"
          [[ -f .env ]] || exit 0
          sed -n "s/^[[:space:]]*$2[[:space:]]*=[[:space:]]*//p" .env \
              | tail -n1 \
              | tr -d '\r' \
              | sed -e 's/[[:space:]]*$//' -e "s/^'\(.*\)'\$/\1/" -e "s/^\"\(.*\)\"\$/\1/"
          REMOTE_SCRIPT
          }

          fail=0

          for name in KC_DB_PASSWORD KC_ADMIN KC_ADMIN_PASSWORD KEYCLOAK_ADMIN_CLIENT_SECRET PLANELYX_PROVISIONING_SECRET LISTRYX_KEYCLOAK_ADMIN_CLIENT_SECRET; do
              on_vps=$(read_env_key "$name")
              if [[ $on_vps != "${!name}" ]]; then
                  echo "::error::Secret drift: $name differs between the repo secret and the VPS .env. If this is a deliberate rotation, re-run from Actions with 'Allow credentials to differ' ticked — and make sure the Postgres role, or planelyx-infra's copy of the shared secret, was changed to match."
                  fail=1
              fi
          done

          (( fail == 0 )) || exit 1
          echo "No drift: the five credentials match what the VPS is already using."

      - name: Stage the rendered .env
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          KC_DB_PASSWORD: ${{ secrets.KC_DB_PASSWORD }}
          KC_ADMIN: ${{ secrets.KC_ADMIN }}
          KC_ADMIN_PASSWORD: ${{ secrets.KC_ADMIN_PASSWORD }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          PLANELYX_PROVISIONING_SECRET: ${{ secrets.PLANELYX_PROVISIONING_SECRET }}
          LISTRYX_KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.LISTRYX_KEYCLOAK_ADMIN_CLIENT_SECRET }}
          AUTH_LOG_LEVEL: ${{ vars.AUTH_LOG_LEVEL }}
        run: |
          set -euo pipefail
          umask 077

          rendered=$(
              printf '# Rendered by .github/workflows/deploy.yml (run %s). Hand edits are lost on the next deploy.\n' "$GITHUB_RUN_ID"
              printf 'REGISTRY=%s-docker.pkg.dev/%s/%s\n' "$REGION" "$GCP_PROJECT_ID" "$REPOSITORY"
              printf 'AUTH_TAG=%s\n' "$AUTH_TAG"
              printf "KC_DB_PASSWORD='%s'\n" "$KC_DB_PASSWORD"
              printf "KC_ADMIN='%s'\n" "$KC_ADMIN"
              printf "KC_ADMIN_PASSWORD='%s'\n" "$KC_ADMIN_PASSWORD"
              printf "KEYCLOAK_ADMIN_CLIENT_SECRET='%s'\n" "$KEYCLOAK_ADMIN_CLIENT_SECRET"
              printf "PLANELYX_PROVISIONING_SECRET='%s'\n" "$PLANELYX_PROVISIONING_SECRET"
              printf "LISTRYX_KEYCLOAK_ADMIN_CLIENT_SECRET='%s'\n" "$LISTRYX_KEYCLOAK_ADMIN_CLIENT_SECRET"
              printf 'AUTH_LOG_LEVEL=%s\n' "${AUTH_LOG_LEVEL:-info}"
          )

          printf '%s\n' "$rendered" \
              | ssh $SSH_OPTS "$REMOTE" "umask 077 && cat > '$VPS_PATH/.env.staged'"

          echo "Staged .env (contents deliberately not logged)."

      - name: Deploy
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP:-/tmp}/deploy-remote.log"

          ssh $SSH_OPTS "$REMOTE" bash -s -- "$VPS_PATH" "$WAIT_TIMEOUT" $PAYLOAD <<'REMOTE_SCRIPT' | tee "$log"
          set -euo pipefail
          cd "$1"
          wait_timeout=$2
          shift 2
          payload=("$@")

          cp .env .env.prev 2>/dev/null || true
          mv .env.staged .env

          # Replace each shipped path wholesale so deletions propagate, while leaving
          # .env and the Docker volumes alone.
          for item in "${payload[@]}"; do
              rm -rf "./$item"
              cp -a ".staged/$item" "./$item"
          done
          rm -rf .staged

          docker compose -f compose.prod.yaml pull -q
          docker compose -f compose.prod.yaml up -d --force-recreate --wait --wait-timeout "$wait_timeout" --remove-orphans

          docker image prune -f || true
          echo
          docker compose -f compose.prod.yaml ps
          echo DEPLOY_SCRIPT_COMPLETE
          REMOTE_SCRIPT

          grep -qx DEPLOY_SCRIPT_COMPLETE "$log" || {
              echo "::error::The remote deploy script did not run to completion — its closing sentinel never arrived, so the stack may be half-updated."
              exit 1
          }

      - name: Install the nginx config
        run: |
          set -euo pipefail

          ssh $SSH_OPTS "$REMOTE" bash -s -- "$VPS_PATH" $NGINX_PAYLOAD <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$1"
          shift
          payload=("$@")

          # Repo path -> live path. The vhosts have no .conf suffix on the box; the snippet does.
          live_path_for() {
              case "$1" in
                  nginx/auth.conf)                     echo /etc/nginx/sites-available/auth ;;
                  nginx/catch-all.conf)                echo /etc/nginx/sites-available/catch-all ;;
                  nginx/snippets/keycloak-proxy.conf)  echo /etc/nginx/snippets/keycloak-proxy.conf ;;
                  *) echo "error: no live path mapped for '$1'" >&2; return 1 ;;
              esac
          }

          mkdir -p nginx-prev
          changed=()

          for item in "${payload[@]}"; do
              new=".nginx-staged/$item"
              live=$(live_path_for "$item")

              if [[ ! -e $live ]]; then
                  echo "error: $live does not exist. Run the bootstrap in VPS_SETUP.md §4 first." >&2
                  exit 1
              fi
              if [[ ! -w $live ]]; then
                  echo "error: $live is not writable by this user. See VPS_SETUP.md §4." >&2
                  exit 1
              fi

              cmp -s "$new" "$live" || changed+=("$item")
          done

          if (( ${#changed[@]} == 0 )); then
              echo "nginx: config unchanged, not reloading"
              exit 0
          fi

          printf 'nginx: changed -> %s\n' "${changed[@]}"

          restore() {
              for item in "${changed[@]}"; do
                  cp "nginx-prev/$(basename "$item")" "$(live_path_for "$item")"
              done
          }

          for item in "${changed[@]}"; do
              live=$(live_path_for "$item")
              cp "$live" "nginx-prev/$(basename "$item")"
              cp ".nginx-staged/$item" "$live"
          done

          # Validate before reloading: this nginx also serves planelyx.com and
          # monitoring.macedosoftware.com, so a bad config here must never reach the
          # running process.
          if ! sudo nginx -t; then
              restore
              echo "error: nginx -t failed; previous config restored, nginx not reloaded" >&2
              exit 1
          fi

          sudo systemctl reload nginx
          echo "nginx: config updated and reloaded"
          REMOTE_SCRIPT

      - name: Smoke checks
        run: |
          set -euo pipefail
          fail=0

          while read -r host realm; do
              [[ -n ${host:-} ]] || continue

              want="$host/auth/realms/$realm"
              got=$(curl -fsS --retry 10 --retry-delay 3 \
                  "$want/.well-known/openid-configuration" | jq -r '.issuer') || got=""

              if [[ $got == "$want" ]]; then
                  echo "auth: issuer on $host is $got"
              else
                  echo "::error::auth: issuer on $host is '${got:-unreachable}', expected '$want'."
                  fail=1
              fi
          done <<< "$ISSUER_CHECKS"

          probe=$(head -n1 <<< "$ISSUER_CHECKS" | awk '{print $1"/auth/realms/"$2}')
          forged=$(curl -fsS --retry 3 --retry-delay 2 -H 'Host: forged.example' \
              "$probe/.well-known/openid-configuration" | jq -r '.issuer') || forged=""

          if [[ $forged == *forged.example* ]]; then
              echo "::error::auth: a forged Host header reached Keycloak — the issuer came back as '$forged'. Pin Host and X-Forwarded-Host in the /auth/ location (VPS_SETUP.md §4)."
              fail=1
          else
              echo "auth: a forged Host header does not reach Keycloak"
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' "$ADMIN_URL/auth/admin/") || code="000"
          if [[ $code == 200 || $code == 302 ]]; then
              echo "auth: the admin console answers on $ADMIN_URL"
          else
              echo "::error::auth: $ADMIN_URL/auth/admin/ returned $code."
              fail=1
          fi

          # The nginx reload touched a process shared with the planelyx and monitoring stacks.
          if curl -fsS --retry 5 --retry-delay 3 -o /dev/null "$NEIGHBOUR_URL"; then
              echo "neighbour: $NEIGHBOUR_URL still serves"
          else
              echo "::error::neighbour: $NEIGHBOUR_URL broke after the nginx reload."
              fail=1
          fi

          (( fail == 0 )) || exit 1

      - name: Dump logs on failure
        if: failure()
        run: |
          if [[ -n ${REMOTE:-} ]]; then
              ssh $SSH_OPTS "$REMOTE" "cd '$VPS_PATH' && docker compose -f compose.prod.yaml logs --tail 50" || true
          fi

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
              echo "## Deploy — ${{ job.status }}"
              echo
              echo "| Service | Tag | Source |"
              echo "|---|---|---|"
              echo "| \`keycloak\` | \`${AUTH_TAG:0:7}\` | ${{ needs.build.result == 'skipped' && 'redeployed, not rebuilt' || 'built by this run' }} |"
              echo
              echo "Rollback: Actions → deploy → Run workflow with the previous commit SHA in"
              echo "\`auth_tag\`. That skips the build and redeploys the image already in the registry."
              echo "The tag this run replaced is in \`.env.prev\` on the VPS."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        run: |
          if [[ -n ${REMOTE:-} ]]; then
              ssh $SSH_OPTS "$REMOTE" "rm -rf '$VPS_PATH/.staged' '$VPS_PATH/.env.staged' '$VPS_PATH/.nginx-staged'" || true
          fi
          rm -f ~/.ssh/deploy_key ~/.ssh/deploy_known_hosts
